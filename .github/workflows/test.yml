name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lua5.2
            executable: lua5.2
          - package: lua5.4
            executable: lua5.4
          - package: luajit
            executable: luajit
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }} ffmpeg python3
      - name: Run complete suite
        env:
          LUA_BIN: ${{ matrix.executable }}
        run: bash tools/run-tests.sh
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.executable }}
          path: |
            *.log
            dist/*verification.txt
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and FFmpeg
        shell: powershell
        run: |
          choco install lua ffmpeg -y --no-progress
          $lua = Get-ChildItem "${env:ProgramFiles(x86)}\Lua" -Filter lua.exe -Recurse -File | Select-Object -First 1
          if (-not $lua) { throw "Chocolatey installed Lua but lua.exe was not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $lua.DirectoryName
      - name: Run Windows suite
        shell: powershell
        env:
          LUA_BIN: lua.exe
        run: tools/run-tests.ps1
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: |
            *.log
            dist/*verification.txt
          if-no-files-found: ignore

  native-mpv:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install native mpv and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg python3
      - name: Report mpv version
        run: mpv --version | head -n 2
      - name: Native multi-instance and crash-recovery smoke
        run: python3 tests/integration/mpv_native_cache_smoke.py --root .

  package:
    needs: [lua, windows, native-mpv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.4 ffmpeg python3
      - name: Verify source
        env:
          LUA_BIN: lua5.4
        run: bash tools/run-tests.sh
      - name: Build deterministic release
        run: python3 tools/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: uosc-waveform-release
          path: dist/
