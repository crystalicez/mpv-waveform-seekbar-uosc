name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lua5.2
            executable: lua5.2
          - package: lua5.4
            executable: lua5.4
          - package: luajit
            executable: luajit
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }} ffmpeg python3
      - name: Run complete suite
        env:
          LUA_BIN: ${{ matrix.executable }}
        run: bash tools/run-tests.sh
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.executable }}
          path: |
            *.log
            dist/*verification.txt
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Chocolatey's community V2 package feed can return HTTP 503 for
      # Lua/FFmpeg and old CRT dependencies. Use independent setup sources.
      - name: Configure MSVC for Lua
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.1.5"
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
      - name: Verify Windows tools
        shell: powershell
        run: |
          lua -v
          ffmpeg -version | Select-Object -First 1
      - name: Run Windows suite
        shell: powershell
        env:
          LUA_BIN: lua
        run: tools/run-tests.ps1
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows
          path: |
            *.log
            dist/*verification.txt
          if-no-files-found: ignore

  native-mpv:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install native mpv and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg python3
      - name: Report mpv version
        run: mpv --version | head -n 2
      - name: Native multi-instance and crash-recovery smoke
        run: python3 tests/integration/mpv_native_cache_smoke.py --root .

  package:
    needs: [lua, windows, native-mpv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.4 ffmpeg python3
      - name: Verify source
        env:
          LUA_BIN: lua5.4
        run: bash tools/run-tests.sh
      - name: Build deterministic release
        run: python3 tools/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: uosc-waveform-release
          path: dist/
