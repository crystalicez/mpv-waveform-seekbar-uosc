# uosc-waveform 0.3.1
# Values outside documented safe ranges are clamped at startup.
enabled=yes
ffmpeg_path=ffmpeg
opacity=0.38
color_mode=auto
light_color=#101010
dark_color=#F2F2F2
source_width=4096
source_height=128
displayed_height_ratio=0.78
# Symmetric clearance for chapter markers; the same inset is applied below.
reserved_marker_ratio=0.20
reserved_progress_px=2
minimum_timeline_width=320
resize_debounce_ms=120
# Max 60 FPS proximity updates; set 0 for every mouse event.
mouse_update_interval_ms=16
media_debounce_ms=250
cache_dir=~~/cache/uosc-waveform
max_cache_age_days=60
max_cache_mb=512
stale_lock_seconds=900
lock_poll_ms=500
compatibility=uosc-5.12
adapter_override=
# error, warn, info, debug. Use debug only while diagnosing.
log_level=warn
analysis_sample_rate=8000
# Abort a stuck FFmpeg analysis after this many seconds. 0 disables the watchdog.
generation_timeout_seconds=180
overlay_id=63

# Diagnostics. Startup OSD is silent by default; Alt+Shift+W shows status.
# Set startup_osd=yes temporarily only when diagnosing script loading.
startup_osd=no
diagnostic_log=yes
